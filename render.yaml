services:
  - type: web
    name: parental-control-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install --include=dev && npx prisma generate && npm run build
    startCommand: cd backend && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: postgresql://parental_control_user:hxQIu6BNL6FCquWeipzlVKwk8CErFVsL@dpg-d9hsvk04n6ts73bg3hi0-a/parental_control?sslmode=require
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://parental-control-dashboard.onrender.com
    healthCheckPath: /health
    autoDeploy: true
