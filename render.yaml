services:
  - type: web
    name: parental-control-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push --skip-generate && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: parental-control-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://parental-control-dashboard.onrender.com
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: parental-control-db
    plan: free
    databaseName: parental_control
    postgresMajorVersion: "16"
